<style>
/* 巻物の年表：生成りの和紙に墨の字、朱の印。札を押すと、年表に年と一言が書きこまれる */
:root{
  --bg:#f3ead8; --paper:#fffaf0; --ink:#2a2420; --ink2:#5a5048; --line:#2a242026; --wash:#e9dcc2;
  --ai:#24427a; --ai2:#142a52; --shu:#b23a24; --shu2:#7f2414; --ok:#25734a; --ok2:#174f31; --gold:#8a5d0c;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-head:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
html.fs1{font-size:17px}html.fs2{font-size:20px}html.fs3{font-size:24px}
html{height:100%}body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-tap-highlight-color:transparent;line-height:1.6}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 88px;display:flex;flex-direction:column;gap:14px;min-height:100vh;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
h1{font-weight:900;font-size:1.15rem;margin:0;letter-spacing:.04em;flex:1;min-width:0}
h1 small{display:block;font-size:.75rem;letter-spacing:0;color:var(--ink2);font-weight:500;line-height:1.3}
.icon{all:unset;cursor:pointer;font-size:1.2rem;min-width:52px;height:52px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);box-sizing:border-box;padding:0 10px;background:var(--paper);font-weight:700}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:16px;background:var(--shu);color:#fff;font-weight:900;font-size:1.1rem;padding:8px 18px;text-align:center;box-shadow:0 5px 0 var(--shu2);line-height:1.35;flex-wrap:wrap}
button.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shu2)}
button.main.alt{background:var(--ai);box-shadow:0 5px 0 var(--ai2)}
button.main.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok2)}
button.main small{font-weight:500;font-size:.8rem}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:.95rem;padding:4px 12px;text-align:center;line-height:1.35}
button.sub:disabled,button.main:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:.85rem;line-height:1.7;margin:0;text-align:center}
.note a,.about a{color:var(--shu2);display:inline-flex;align-items:center;min-height:44px}
.big{font-weight:900;font-size:1.5rem;text-align:center;margin:0;line-height:1.35}
.title{font-family:var(--f-head);font-weight:900;font-size:2.3rem;letter-spacing:.16em;text-align:center;margin:6px 0 0;color:var(--ink)}
.title span{color:var(--shu)}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:.95rem;line-height:1.7}
.fsrow{display:flex;gap:6px;align-items:center;justify-content:center;font-size:.85rem;color:var(--ink2)}
.fsrow button{all:unset;box-sizing:border-box;cursor:pointer;min-width:52px;min-height:48px;display:grid;place-items:center;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:900;color:var(--ink)}
.fsrow button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tip{background:var(--paper);border:2px dashed var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.9rem;line-height:1.7;text-align:left}
.tip b{color:var(--shu2)}
/* 時代のものさし（古い→新しい）。ヒントで、札の時代に印が付く */
.ruler{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:.72rem;line-height:1.2}
.ruler span{padding:3px 6px;border-radius:6px;background:var(--wash);color:var(--ink2);border:1px solid transparent}
.ruler span.hit{background:var(--paper);color:var(--ink);border:2px solid var(--ai);font-weight:900}
.ruler span.hit::before{content:"● ";color:var(--ai)}
.ruler i{font-style:normal;color:var(--ink2);align-self:center}
/* 年表（巻物） */
.scroll{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:.7rem .7rem .8rem 2.6rem;box-shadow:0 6px 0 #2a242014}
.scroll::before{content:"";position:absolute;left:1.25rem;top:.9rem;bottom:.9rem;width:3px;background:linear-gradient(var(--shu),var(--shu2));border-radius:2px}
.scroll .ends{position:absolute;left:.25rem;font-size:.62rem;color:var(--ink2);width:2.2rem;text-align:center;line-height:1.1}
.scroll .ends.top{top:.1rem}.scroll .ends.bot{bottom:.1rem}
.slot{position:relative;min-height:2.9rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px dashed #2a242030;padding:.3rem 0}
.slot:last-child{border-bottom:none}
.slot::before{content:attr(data-n);position:absolute;left:-1.95rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--paper);border:2px solid var(--shu);color:var(--shu2);font-size:.75rem;font-weight:900;display:grid;place-items:center}
.slot.on::before{background:var(--shu);color:#fff}
.slot .yr{font-family:var(--f-head);font-weight:900;font-size:1.25rem;min-width:3.6rem;font-variant-numeric:tabular-nums;color:var(--shu2);text-align:right}
.slot .yr small{font-size:.6em;margin-left:1px}
.slot .ev{flex:1;min-width:0;font-weight:700;line-height:1.35}
.slot .ev small{display:block;font-weight:500;font-size:.75rem;color:var(--ink2)}
.slot.empty .ev{color:var(--ink2);font-weight:500}
.slot.next .ev{color:var(--shu2);font-weight:900}
.slot.new{animation:pop .35s}
/* 札 */
.cards{display:flex;flex-direction:column;gap:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-height:4rem;display:flex;flex-direction:column;justify-content:center;border-radius:12px;background:#fff;border:2px solid var(--ink);box-shadow:0 4px 0 #2a242040;padding:.5rem 2.6rem .5rem .9rem;font-weight:900;font-size:1.08rem;line-height:1.4;color:var(--ink)}
.card::after{content:"";position:absolute;right:.7rem;top:50%;width:1.3rem;height:1.3rem;margin-top:-.65rem;border-radius:4px;border:2px solid var(--shu);opacity:.7}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 #2a242040}
.card .era{display:inline-block;align-self:flex-start;margin-top:.25rem;font-size:.72rem;font-weight:700;color:var(--ai2);border:1.5px solid var(--ai);border-radius:6px;padding:0 6px;background:#eef3fb}
.card.ng{opacity:.55;border-style:dashed;border-color:var(--shu);cursor:default;box-shadow:none;animation:shake .4s}
.card.ng::after{content:"✕";border:none;opacity:1;color:var(--shu2);font-size:1.1rem;margin-top:-.8rem;text-align:center}
.card:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.q{margin:0;font-weight:900;font-size:1.05rem;text-align:center}
.msg{min-height:1.6rem;text-align:center;font-weight:700;font-size:1rem;margin:0}
.msg.bad{color:var(--shu2)}
.verdict{background:var(--paper);border:2px solid var(--ok);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #2a242020;animation:up .35s ease-out}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:1.3rem;font-weight:900;flex-wrap:wrap}
.verdict ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.verdict li{font-size:.92rem;line-height:1.6}
.verdict li b{color:var(--shu2);font-family:var(--f-head)}
.hint{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.95rem;line-height:1.7}
.stars{color:var(--gold);letter-spacing:.08em;font-size:1.2rem}
.stars .off{color:#2a242040}
.dots{display:flex;gap:6px;flex:1;max-width:200px}
.dots i{flex:1;height:8px;border-radius:4px;background:transparent;border:1.5px solid var(--ink2);box-sizing:border-box}
.dots i.on{background:var(--shu);border-color:var(--shu);height:12px;margin-top:-2px}.dots i.done{background:var(--ai);border-color:var(--ai)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:1.3rem}
.stats small{color:var(--ink2);font-size:.75rem}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:1rem;line-height:1.6;text-align:center;border:2px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist>div{display:flex;align-items:flex-start;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem;line-height:1.5}
.rlist .w{flex:1;min-width:0}
.achnext{text-align:center;font-size:.9rem;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:.95rem;font-weight:700;color:var(--shu2);margin:0;animation:up .35s ease-out}
.badge{background:var(--shu);color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
.lv{display:flex;flex-direction:column;gap:10px}
/* 年表帳 */
.book{display:flex;flex-direction:column;gap:8px}
.book button,.book .no{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:4.2rem 1fr auto;align-items:center;gap:10px;min-height:52px;border-radius:12px;padding:6px 12px;background:var(--paper);border:2px solid var(--line);font-size:.92rem;line-height:1.4}
.book .no{cursor:default;color:var(--ink2);border-style:dashed}
.book .mk{font-family:var(--f-head);font-weight:900;color:var(--shu2);text-align:right}
.book .ct{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.book .full{border-color:var(--ai);background:#eef3fb}
.agrp{font-size:.85rem;color:var(--ink2);margin:4px 0 -6px;font-weight:700;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:1.2rem;text-align:center}
.ach b{grid-area:nm;font-size:.95rem}.ach small{grid-area:cd;color:var(--ink2);font-size:.8rem;line-height:1.4}
.ach .pg{grid-area:pg;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--ai)}
.ach.got{background:#eef3fb;border-color:var(--ai)}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.5}
.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:1.05rem}.calnav .sub{flex:0 0 72px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1}
.cal .c i{font-style:normal;font-size:.55rem;letter-spacing:-.05em;color:var(--gold)}
.cal .c.p1{background:#eef3fb}.cal .c.p2{background:#d5e1f3}.cal .c.p3{background:var(--ai);color:#fff;border-color:var(--ai2)}.cal .c.p3 i{color:#ffe9a8}
.cal .c.late{background:transparent;border:1.5px dashed var(--ai);color:var(--ai2)}
.cal .c.miss{cursor:pointer;border:2px dotted var(--shu);color:var(--shu2);background:#fff}
.cal .c.miss i{color:var(--shu2)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:.55rem;color:var(--shu2);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
.about h3{font-size:1rem;margin:.6rem 0 .2rem;color:var(--ai2)}
.about p,.about li{font-size:.92rem;line-height:1.8;text-align:left}
.about ul{padding-left:1.2em;margin:0}
dialog#howto{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-sizing:border-box;font-size:1rem}

dialog#howto h2{margin:0 0 10px;letter-spacing:.1em}
dialog#howto ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog#howto p{margin:0 0 10px;font-size:.9rem;line-height:1.7;color:var(--ink2)}
dialog#howto a{color:var(--shu2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center;font-size:1rem}
footer{margin-top:auto;text-align:center;font-size:.8rem;color:var(--ink2);display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
/* 色の見分けを助ける：ちがう札の ✕ と破線を太く、時代の印を太く */

html.a11y-cvd .ruler span.hit{border-width:3px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:is(.icon,button,a):focus-visible{outline:3px solid var(--shu)!important;outline-offset:2px}
</style>

<script>

  ["都のひっこし", "藤原京→平城京（奈良）→長岡京→平安京（京都）の順です。"],
  ["幕府は3つ", "鎌倉幕府→室町幕府→江戸幕府。「征夷大将軍になる」は幕府の始まりです。"],
  ["始まりと終わり", "戦争が「始まる」のが先、終わらせる「条約」があと。"],
  ["元号の順", "明治→大正→昭和→平成→令和。「元号が変わる」は時代の切れ目です。"],

// ---- とことん：やさしい5 → ふつう10 → むずかしい（足りなくなれば足し続ける）。毎回ちがう並び（乱数は練習ととことんだけ）----

function extend(list, lv, n) {

const fresh = () => ({ v: 1, days: {}, hdays: {}, adays: {}, dex: {}, runs: {}, tut: false, kofi: {}, ach: {}, ebest: 0, solved: 0 });

function bank(s, r) { const b = doneOf(r) ? bookOf(s, r.mode) : null; if (!b || b[r.date] || (r.mode === "a" && s.days[r.date])) return false; b[r.date] = recOf(r); return true; }

const num = (v) => (Number.isFinite(+v) && +v >= 0 ? Math.floor(+v) : 0);

  const okDate = (v) => { if (typeof v !== "string" || !/^\d{4}-\d\d-\d\d$/.test(v)) return false; const t = Date.parse(v + "T00:00:00Z"); return Number.isFinite(t) && new Date(t).toISOString().slice(0, 10) === v; };

function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }

    <button class="main" id="go-e">もう一度とことん</button>
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">年表帳を見る</button></div>
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-e").onclick = () => startRun("e"); $("go-p").onclick = practiceMenu; $("go-dex").onclick = () => book();
  toTop();
}
// 共有の文：できごとと年は出さない。まちがい＋ヒントの数で色と形を変える（色だけで分けない）
const sq = (m) => (m === 0 ? "🟢" : m === 1 ? "🔶" : "🔺");
function shareText(mode, k, rec) { return `歴史ならべ${mode === "h" ? " 上級" : ""} 第${dayNo(k)}回 ${md(k)}\n${rec.m.map(sq).join("")}${rec.m.every((m) => m === 0) ? " まちがいなし" : ""}`; }
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, newAch = []) {
  const s = load(), rec = mode === "p" ? prec : bookOf(s, mode)[k];
  if (!rec) return home();
  const list = mode === "p" ? prec.list : listOf(mode, k), total = rec.m.reduce((a, b) => a + b, 0), late = mode === "a", text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && !late && total === 0 && !s.kofi[k + mode]; // あとから・練習・まちがいのある日には出さない
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>歴史ならべ<small>${mode === "d" ? `今日の5問 第${dayNo(k)}回` : late ? `第${dayNo(k)}回 あとから` : mode === "h" ? "上級" : "練習"}</small></h1></header>
    <p class="big">${total === 0 ? "全部まちがいなし！" : `${list.length}問 並べました`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 あと${nx.left}${nx.unit}で「${nx.name}」</p>` : ""; })()}
    <p class="agrp">覚えた年表</p>
    <div class="rlist">${list.map((tag, j) => { const P = G.make(tag); return `<div><span>${starStr(starsOf(rec.m[j]))}</span><span class="w">${P.order.map((e) => `<b>${e.y}</b> ${esc(e.t)}`).join("<br>")}</span></div>`; }).join("")}</div>
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（続けた日には数えません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    ${mode !== "p" && !late ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟢まちがいなし　🔶1回　🔺2回以上<br>次の5問まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode !== "p" ? `<button class="main alt" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}問）` : ""}</button>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：5枚ならべに挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">年表帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-p").onclick = practiceMenu; $("go-dex").onclick = () => book();
  if ($("go-e")) $("go-e").onclick = () => startRun("e");
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home());
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
  toTop();
}

// 年表帳：時代ごとに、並べたできごとが年といっしょに集まる。時代を押すと、その時代のできごとと練習
function book(g) {
  const s = load(), n = evCount(s);
  if (g == null) {
    app.innerHTML = `
      <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>年表帳<small>${n}/${G.EV.length}のできごと</small></h1></header>
      <p class="note">並べたできごとが、年といっしょに集まります。時代を押すと、中を見たり、その時代だけで練習したりできます。</p>
      <div class="book">${G.GROUPS.map((name, gi) => { const all = G.EV.filter((e) => groupOf(e) === gi), got = all.filter((e) => s.dex[e.id] > 0).length; return `<button data-g="${gi}" class="${got === all.length ? "full" : ""}"><span class="mk">${got === all.length ? "✓ " : ""}${esc(name)}</span><span>${all[0].y}〜${all[all.length - 1].y}年</span><span class="ct">${got}/${all.length}</span></button>`; }).join("")}</div>
      ${footer()}`;
    $("back").onclick = home;
    document.querySelectorAll(".book button").forEach((b) => (b.onclick = () => book(+b.dataset.g)));
    bindFooter(); toTop(); return;
  }
  const all = G.EV.filter((e) => groupOf(e) === g).sort((a, b) => a.y - b.y || a.n - b.n), got = all.filter((e) => s.dex[e.id] > 0).length;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="年表帳へ">←</button><h1>${esc(G.GROUPS[g])}<small>${got}/${all.length}のできごと</small></h1></header>
    <button class="main alt" id="go-pg">この時代だけで練習（5問）</button>
    <div class="book" id="evlist">${all.map((e) => s.dex[e.id] > 0 ? `<span class="no" style="border-style:solid;color:var(--ink);cursor:default"><span class="mk">${e.y}</span><span>${esc(e.t)}<br><small style="color:var(--ink2)">${esc(e.w)}</small></span><span class="ct">${s.dex[e.id]}回</span></span>` : `<span class="no" role="img" aria-label="まだ並べていないできごと"><span class="mk">？</span><span>まだ</span><span class="ct"></span></span>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = () => book();
  $("go-pg").onclick = () => startRun("p", "g" + g);
  bindFooter(); toTop();
}
function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic" aria-hidden="true">🏅</span><b>${ok ? "✓ " : ""}${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}
// 遊んだ日のカレンダー：今日の5問の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const lvOf = (rec) => { const t = rec && Array.isArray(rec.m) ? rec.m.reduce((a, b) => a + b, 0) : 9; return t === 0 ? 3 : t <= 2 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ${hd ? "・上級も" : ""}">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" role="img" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  const pd = playedDays(s);
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${pd ? `<small>合わせて ${pd}日${st >= 1 ? `・続けて ${st}日` : ""}</small>` : ""}</h1></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><em style="background:var(--ai)"></em>★★★ まちがいなし</span><span><em style="background:#d5e1f3"></em>★★ 1〜2回</span><span>↺ あとから</span><span>上 上級</span><span>▶ あとから遊べる</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5問をあとから遊べます（過去7日まで・続けた日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home; $("prev").onclick = () => cal(ymAdd(ym, -1)); $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym))));
  bindFooter(); toTop();
}
function about() {
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>このゲームについて</h1></header>
    <div class="about" id="about">
      <h3>並べて、年表を自分で作る</h3>
      <p>日本の歴史のできごとを古い順に並べます。知らなくても、ヒントの「時代」と、時代のものさしを手がかりに並べられます。並べると、年と一言の説明が出ます。</p>
      <h3>思い出して答えると、覚えやすい</h3>
      <p>読むだけより、自分で思い出して答えるほうが記憶に残りやすいことが、多くの研究で分かっています（<a href="https://journals.sagepub.com/doi/10.3102/0034654316689306" target="_blank" rel="noopener">Adesope ほか 2017</a>）。間をあけてくり返すのも効果があります（<a href="https://pubmed.ncbi.nlm.nih.gov/16719566/" target="_blank" rel="noopener">Cepeda ほか 2006</a>）。毎日5問ずつ、年表帳から見直してください。</p>
      <h3>年の出どころ</h3>
      <p>年は、学校の日本史で広く使われている年（西暦）です。昔の暦（旧暦）の年を西暦に合わせて書いています。年がはっきりしないできごと・説が分かれるできごとは入れていません。（例：伊能忠敬の日本地図の完成は1821年。<a href="https://www.gsi.go.jp/MUSEUM/SOUGO/kohokocho20211019_00001.html" target="_blank" rel="noopener">国土地理院</a>）まちがいに気づいたら「感想を送る」から教えてください。</p>
    </div>${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}

window.__rk = { mode: () => MODE, load, save, todayKey, dayNo, lateDays, ACH, achGot, nextAch, tally, shareText, streak, endlessList, extend, ERAMP, TIPS, cur: () => cur, play: (m) => { if (m) MODE = m; play(); }, home, cal, book, about, EPOCH, KEY, G };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
